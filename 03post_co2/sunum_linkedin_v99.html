<!DOCTYPE html>
<html lang="tr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arkhe Enerjimetre — CO₂ Takibi</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap"
    rel="stylesheet">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-user-select: none;
      user-select: none;
    }

    :root {
      --white: #ffffff;
      --black: #0a0a0a;
      --gray-100: #f5f5f5;
      --gray-200: #e8e8e8;
      --gray-400: #999;
      --gray-700: #333;
      --accent: #00b4d8;
      --accent-dark: #0077a8;
      --font-display: 'Bebas Neue', sans-serif;
      --font-body: 'DM Sans', sans-serif;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: #fff;
      font-family: var(--font-body);
      overflow: hidden;
    }

    .scene {
      position: absolute;
      inset: 0;
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      gap: 16px;
      padding: 4vh 4vw;
    }

    /* Sol kolon — 2 video alt alta (grid satır 1 ve 2'yi kaplar) */
    .video-cell {
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .video-cell video {
      width: 115%;
      height: 115%;
      object-fit: contain;
      transform: scale(1.05);
    }

    /* Sağ kolon — metin, dikey ortalı, iki satırı kaplar */
    .text-cell {
      grid-column: 2;
      grid-row: 1 / span 2;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-start;
      padding: 0 2vw;
    }

    .label {
      font-family: var(--font-display);
      font-size: clamp(20px, 2.2vw, 32px);
      letter-spacing: 0.35em;
      color: var(--accent);
      margin-bottom: 14px;
    }

    .title {
      font-family: var(--font-display);
      font-size: clamp(44px, 6vw, 96px);
      color: var(--black);
      line-height: 0.95;
      margin-bottom: 22px;
      letter-spacing: 0.04em;
    }

    .body {
      font-family: var(--font-body);
      font-size: clamp(16px, 1.6vw, 22px);
      font-weight: 400;
      color: var(--gray-700);
      line-height: 1.5;
    }

    .body b {
      color: var(--accent);
      font-weight: 600;
    }

    .corner {
      position: fixed;
      bottom: 16px;
      right: 22px;
      font-family: var(--font-display);
      font-size: 13px;
      letter-spacing: 0.3em;
      color: var(--gray-400);
      z-index: 10;
    }

    /* Mobile portrait: 2 video üstte yan yana, metin altta */
    @media (orientation: portrait) and (max-width: 900px) {
      .scene {
        grid-template-columns: 1fr 1fr;
        grid-template-rows: auto auto;
        gap: 10px;
      }
      .text-cell {
        grid-column: 1 / span 2;
        grid-row: 2;
        padding: 14px 6vw;
      }
      .video-cell video {
        width: 100%;
        height: auto;
        max-height: 30vh;
      }
      .title {
        font-size: 44px;
      }
    }
  </style>
</head>

<body>
  <div class="scene">
    <!-- Sol üst: CO2 kadran -->
    <div class="video-cell">
      <video autoplay loop muted playsinline preload="auto">
        <source src="../videos/05_co2_gauge.mp4" type="video/mp4">
      </video>
    </div>
    <!-- Sağ: metin (2 satırı kaplar) -->
    <div class="text-cell">
      <div class="label">// CO₂ TAKİBİ</div>
      <div class="title">KARBON<br>KİMLİĞİ</div>
      <div class="body">
        Anlık <b>CO₂ emisyonu</b> ve toplam birikim. Şebeke karbon faktörü × makinenin kWh tüketimi —
        sürdürülebilirlik raporlaması için <b>üretim bazlı</b> hazır veri.
      </div>
    </div>
    <!-- Sol alt: CO2 büyük -->
    <div class="video-cell">
      <video autoplay loop muted playsinline preload="auto">
        <source src="../videos/06_co2_big.mp4" type="video/mp4">
      </video>
    </div>
  </div>
  <div class="corner">// ARKHE ENERJİMETRE</div>
</body>

</html>
