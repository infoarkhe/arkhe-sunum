<!DOCTYPE html>
<html lang="tr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arkhe Enerjimetre — Güç Ölçümü</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap"
    rel="stylesheet">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-user-select: none;
      user-select: none;
    }

    :root {
      --white: #ffffff;
      --black: #0a0a0a;
      --gray-100: #f5f5f5;
      --gray-200: #e8e8e8;
      --gray-400: #999;
      --gray-700: #333;
      --accent: #00b4d8;
      --accent-dark: #0077a8;
      --font-display: 'Bebas Neue', sans-serif;
      --font-body: 'DM Sans', sans-serif;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: #fff;
      font-family: var(--font-body);
      overflow: hidden;
    }

    .scene {
      position: absolute;
      inset: 0;
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      gap: 16px;
      padding: 4vh 4vw;
    }

    .cell {
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .cell video {
      width: 115%;
      height: 115%;
      object-fit: contain;
      transform: scale(1.05);
    }

    .cell.text {
      flex-direction: column;
      align-items: flex-start;
      justify-content: center;
      padding: 0 2vw;
    }

    .label {
      font-family: var(--font-display);
      font-size: clamp(20px, 2.2vw, 32px);
      letter-spacing: 0.35em;
      color: var(--accent);
      margin-bottom: 14px;
    }

    .title {
      font-family: var(--font-display);
      font-size: clamp(44px, 6vw, 96px);
      color: var(--black);
      line-height: 0.95;
      margin-bottom: 22px;
      letter-spacing: 0.04em;
    }

    .body {
      font-family: var(--font-body);
      font-size: clamp(16px, 1.6vw, 22px);
      font-weight: 400;
      color: var(--gray-700);
      line-height: 1.5;
    }

    .body b {
      color: var(--accent);
      font-weight: 600;
    }

    .corner {
      position: fixed;
      bottom: 16px;
      right: 22px;
      font-family: var(--font-display);
      font-size: 13px;
      letter-spacing: 0.3em;
      color: var(--gray-400);
      z-index: 10;
    }

    /* Mobile: 2x2 → tek sütun stack */
    @media (orientation: portrait) and (max-width: 900px) {
      .scene {
        grid-template-columns: 1fr;
        grid-template-rows: auto auto auto auto;
        gap: 10px;
      }
      .cell video {
        width: 100%;
        height: auto;
        max-height: 22vh;
      }
      .cell.text {
        padding: 14px 6vw;
      }
      .title {
        font-size: 44px;
      }
    }
  </style>
</head>

<body>
  <div class="scene">
    <!-- Sol üst: kadran -->
    <div class="cell">
      <video autoplay loop muted playsinline preload="auto">
        <source src="../videos/02_power_gauge.mp4" type="video/mp4">
      </video>
    </div>
    <!-- Sağ üst: büyük rakam -->
    <div class="cell">
      <video autoplay loop muted playsinline preload="auto">
        <source src="../videos/03_power_big.mp4" type="video/mp4">
      </video>
    </div>
    <!-- Sol alt: osiloskop -->
    <div class="cell">
      <video autoplay loop muted playsinline preload="auto">
        <source src="../videos/04_power_osiloskop.mp4" type="video/mp4">
      </video>
    </div>
    <!-- Sağ alt: metin -->
    <div class="cell text">
      <div class="label">// GÜÇ ÖLÇÜMÜ</div>
      <div class="title">3 GÖRÜNÜM,<br>TEK VERİ</div>
      <div class="body">
        Aynı anlık güç değerini operatör <b>kadran</b>, <b>büyük rakam</b> ve <b>osiloskop dalga</b> olarak görür.
        Sahada hangisi rahat görünüyorsa o seçilir — arka planda veri aynı, sunum farklıdır.
        Mesai içi ani sıçramayı operatör hızla yakalar, raporda da izi kalır.
      </div>
    </div>
  </div>
  <div class="corner">// ARKHE ENERJİMETRE</div>
</body>

</html>
